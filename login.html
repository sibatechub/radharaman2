function getLocation(){

.getCurrentPosition(

function checkIn(){

let os = "Unknown";

if (/Android/i.test(navigator.userAgent)) {
    os = "Android";
}
else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    os = "iPhone";
}
else if (/Windows/i.test(navigator.userAgent)) {
    os = "Windows";
}
else if (/Mac/i.test(navigator.userAgent)) {
    os = "Mac";
}
else if (/Linux/i.test(navigator.userAgent)) {
    os = "Linux";
}

const fullDevice =
    navigator.userAgent;

const deviceId =
    os + "|" +
    screen.width + "x" + screen.height + "|" +
    navigator.hardwareConcurrency + "|" +
    (navigator.deviceMemory || "NA") + "|" +
    navigator.language + "|" +
    Intl.DateTimeFormat().resolvedOptions().timeZone + "|" +
    screen.colorDepth + "|" +
    navigator.maxTouchPoints + "|" +
    window.devicePixelRatio;

google.script.run

.withSuccessHandler(function(isDuplicate){

    if(isDuplicate){

        const agree = confirm(

            "This mobile has already been used by another staff today.\n\n" +

            "If you continue, an email will immediately be sent to the Center Head.\n\n" +

            "Press OK to continue.\nPress Cancel to stop."

        );

        if(!agree){
            return;
        }

        google.script.run
        .sendDuplicateMail(
            window.currentUser
        );

    }

    google.script.run

    .withSuccessHandler(function(res){

        alert(res.message);

    })

    .saveCheckIn(

        window.currentUser,
        latitude,
        longitude,
        fullDevice,
        deviceId

    );

})

.checkDuplicateDevice(

    deviceId,

    window.currentUser.resourceId

);

}




function checkOut(){

    let os = "Unknown";

    if (/Android/i.test(navigator.userAgent)) {
        os = "Android";
    }
    else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        os = "iPhone";
    }
    else if (/Windows/i.test(navigator.userAgent)) {
        os = "Windows";
    }
    else if (/Mac/i.test(navigator.userAgent)) {
        os = "Mac";
    }
    else if (/Linux/i.test(navigator.userAgent)) {
        os = "Linux";
    }

    const deviceId =
        os + "|" +
        screen.width + "x" + screen.height + "|" +
        navigator.hardwareConcurrency + "|" +
        (navigator.deviceMemory || "NA") + "|" +
        navigator.language + "|" +
        Intl.DateTimeFormat().resolvedOptions().timeZone + "|" +
        screen.colorDepth + "|" +
        navigator.maxTouchPoints + "|" +
        window.devicePixelRatio;

    let shiftCount = prompt(
        "Enter Number of Shifts (0 to 5)",
        "1"
    );

    if (shiftCount === null) return;

    shiftCount = Number(shiftCount);

    if (
        isNaN(shiftCount) ||
        shiftCount < 0 ||
        shiftCount > 5
    ){
        alert("Please enter a value between 0 and 5");
        return;
    }

    google.script.run

    .withSuccessHandler(function(isDuplicate){

        if(isDuplicate){

            const agree = confirm(

                "This mobile has already been used by another staff today.\n\n" +

                "If you continue, an email will immediately be sent to the Center Head.\n\n" +

                "Press OK to continue.\nPress Cancel to stop."

            );

            if(!agree){
                return;
            }

google.script.run
    .sendDuplicateCheckoutMail(window.currentUser);

        }

        google.script.run

        .withSuccessHandler(function(res){

            alert(res.message);

        })

        .saveCheckOut(

            window.currentUser.resourceId,
            latitude,
            longitude,
            shiftCount,
            deviceId

        );

    })

    .checkDuplicateDevice(

        deviceId,
        window.currentUser.resourceId

    );

}

function saveStaffStatus(){

  const list = [];

  document.querySelectorAll(".activeStatus").forEach(function(chk){

    const id = chk.dataset.id;

const selected = document.querySelector(
  '.shift[data-id="' + id + '"]:checked'
);

const shift = selected ? selected.value : "0";

    list.push({

      resourceId: id,

      active: chk.checked ? "YES" : "NO",

      shift: shift

    });

  });

  google.script.run
  .withSuccessHandler(function(msg){

      alert(msg);

  })
  .withFailureHandler(function(err){

      alert(err.message);

  })
  .updateStaffStatus(list);
